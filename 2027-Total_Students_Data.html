<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Placement Portal | MGIT</title>

<!-- CSV Parsing Library -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
/* ===== GLOBAL RESET & FULL-VIEWPORT LOCK ===== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100vh;
    font-family: Arial, sans-serif;
    background-color: #ffffff;
    color: #0f172a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ===== TOP CONTROLS WRAPPER ===== */
.top-controls {
    flex-shrink: 0;
    width: 100%;
    background: #ffffff;
    z-index: 10;
    margin: 0;
    padding: 0;
}

/* ===== CENTERED HEADER ===== */
.header {
    width: 100%;
    padding: 10px 15px;
    background: linear-gradient(135deg, #091e42 0%, #0f2b5c 50%, #16387c 100%);
    border-bottom: 3px solid #ffca28;
    text-align: center;
    margin: 0;
    font-family: Arial, sans-serif;
}

.header-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
}

.header h1 {
    color: #ffffff;
    font-size: 19px;
    text-transform: none;
    letter-spacing: 0.3px;
    font-weight: 700;
    margin: 0;
    font-family: Arial, sans-serif;
}

.header h2 {
    font-size: 12px;
    color: #ffca28;
    font-weight: 600;
    text-transform: none;
    margin-top: 2px;
    font-family: Arial, sans-serif;
}

.header h3 {
    color: #cbd5e1;
    font-size: 11px;
    font-weight: 400;
    text-transform: none;
    margin-top: 1px;
    font-family: Arial, sans-serif;
}

/* ===== MAIN SECTION WRAPPER ===== */
.main-wrapper {
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
}

/* ===== METRIC CARDS & RANGE BOXES (6 CARDS IN 1 ROW) ===== */
.cards-container {
    width: 100%;
    display: grid;
    grid-template-columns: 1.1fr 1.1fr repeat(4, 1fr);
    gap: 0;
    margin: 0;
    padding: 0;
}

.card {
    padding: 5px 4px;
    border-radius: 0;
    color: white;
    min-height: 50px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    position: relative;
    border-right: 1px solid rgba(255, 255, 255, 0.15);
    font-family: Arial, sans-serif;
}

.card:last-child {
    border-right: none;
}

.rank-filter-card {
    background: linear-gradient(135deg, #091e42 0%, #1e293b 100%);
    border-left: 4px solid #00e676;
}

.rank-filter-card h3 {
    color: #00e676;
    margin-bottom: 2px;
    font-family: Arial, sans-serif;
}

.cgpa-filter-card {
    background: linear-gradient(135deg, #0b192c 0%, #1e293b 100%);
    border-left: 4px solid #ffca28;
}

.cgpa-filter-card h3 {
    color: #ffca28;
    margin-bottom: 2px;
    font-family: Arial, sans-serif;
}

.range-inputs {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    margin-top: 1px;
}

.range-inputs input {
    width: 42%;
    padding: 2px 2px;
    border-radius: 3px;
    background: #ffffff;
    color: #000000;
    font-family: Arial, sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    text-align: center;
    outline: none;
}

.rank-filter-card .range-inputs input {
    border: 1px solid #00e676;
}

.cgpa-filter-card .range-inputs input {
    border: 1px solid #ffca28;
}

.range-inputs input:focus {
    border-color: #00e676;
    box-shadow: 0 0 4px rgba(0, 230, 118, 0.6);
}

.range-inputs span {
    color: #ffffff;
    font-weight: 700;
    font-size: 10px;
    font-family: Arial, sans-serif;
}

.card:nth-child(3) { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
.card:nth-child(4) { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
.card:nth-child(5) { background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%); }
.card:nth-child(6) { background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); }

.card h3 {
    margin: 0;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 600;
    text-transform: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: Arial, sans-serif;
}

.card p {
    margin-top: 1px;
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

/* ===== SINGLE ROW FILTER TOOLBAR ===== */
.filter-container {
    width: 100%;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 4px;
    background: #0f172a;
    padding: 5px 6px;
    border-radius: 0;
    border: none;
    margin: 0;
    overflow-x: visible;
}

.filter-container input[type="text"] {
    flex: 1.2;
    min-width: 90px;
    padding: 5px 6px;
    border-radius: 3px;
    border: 1.5px solid #475569;
    background: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #000000;
    outline: none;
}

.filter-container select {
    flex: 1;
    min-width: 75px;
    padding: 5px 3px;
    border-radius: 3px;
    border: 1.5px solid #475569;
    background: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: 800;
    color: #000000;
    outline: none;
    text-overflow: ellipsis;
}

.filter-container select option {
    font-weight: 700;
    color: #000000;
    background-color: #ffffff;
    font-family: Arial, sans-serif;
}

.filter-container input:focus,
.filter-container select:focus {
    border-color: #ff6600;
}

/* ===== CUSTOM CHECKBOX MULTI-SELECT DROPDOWNS ===== */
.multiselect-container {
    position: relative;
    flex: 1;
    min-width: 80px;
}

/* Specific shrink rule for Offers box to fit 1 line */
.multiselect-container[data-key="offers"] {
    min-width: 95px;
    max-width: 125px;
}

.select-box {
    padding: 5px 4px;
    border-radius: 3px;
    border: 1.5px solid #475569;
    background: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 10.5px;
    font-weight: 800;
    color: #000000;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
    white-space: nowrap;
}

.select-box span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.select-box small {
    font-size: 9px;
    margin-left: 2px;
}

.checkboxes-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    min-width: 130px;
    background: #ffffff;
    border: 1px solid #475569;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    z-index: 100;
    max-height: 180px;
    overflow-y: auto;
    padding: 4px;
    border-radius: 3px;
}

.checkboxes-dropdown label {
    display: flex;
    align-items: center;
    padding: 3px 4px;
    font-size: 11px;
    font-weight: 700;
    color: #000000;
    cursor: pointer;
    border-bottom: 1px solid #f1f5f9;
}

.checkboxes-dropdown label:hover {
    background-color: #e2e8f0;
}

.checkboxes-dropdown input[type="checkbox"] {
    margin-right: 6px;
    cursor: pointer;
}

.action-btn {
    padding: 5px 8px;
    border: none;
    border-radius: 3px;
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.2s ease, transform 0.1s ease;
}

.action-btn:active {
    transform: scale(0.97);
}

.reset-btn {
    background: #e11d48;
    color: #ffffff;
}

.reset-btn:hover {
    background: #be123c;
}

.export-btn {
    background: #107c41;
    color: #ffffff;
}

.export-btn:hover {
    background: #0e6b37;
}

/* ==========================================
   TABLE STYLING
   ========================================== */

.table-container {
    flex-grow: 1;
    width: 100%;
    overflow-x: auto !important;
    overflow-y: auto !important;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
    scroll-behavior: smooth;
    background: rgba(255, 255, 255, 0.05);
    padding-bottom: 6px;
}

.table-container::-webkit-scrollbar {
    height: 10px;
    width: 8px;
}

.table-container::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 10px;
}

.table-container::-webkit-scrollbar-thumb {
    background: linear-gradient(90deg, #ff512f, #dd2476);
    border-radius: 10px;
}

.table-container::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(90deg, #00c6ff, #0072ff);
}

table {
    border-collapse: collapse;
    min-width: 1600px;
    width: max-content;
    background: #ffffff;
    color: #222222;
    border-radius: 18px;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

th {
    padding: 8px 9px;
    font-size: 13px;
    font-weight: bold;
    text-align: center;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: #ffffff;
    line-height: 1.3;
    border: 1px solid rgba(255, 255, 255, 0.12);
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 5;
    font-family: Arial, sans-serif;
}

td {
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    white-space: nowrap;
    border: 1px solid rgba(16, 37, 66, 0.12);
    font-family: Arial, sans-serif;
    color: #222222;
}

tr:nth-child(even) td { 
    background-color: #eef5ff !important; 
}

tr:nth-child(odd) td { 
    background-color: #ffffff !important; 
}

tbody tr:hover td { 
    background-color: #ffd180 !important; 
    color: #000000 !important;
    transition: 0.3s; 
}

.link-btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #ffffff;
    padding: 3px 8px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 10px;
    font-weight: bold;
    line-height: 1.2;
    display: inline-block;
    transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    font-family: Arial, sans-serif;
}

.link-btn:hover {
    transform: scale(1.06) translateY(-1px);
    background: linear-gradient(135deg, #00f2fe, #4facfe) !important;
    box-shadow: 0 4px 15px rgba(0, 242, 254, 0.6);
    color: #ffffff !important;
}

.loading {
    text-align: center;
    padding: 30px;
    font-size: 14px;
    font-weight: 600;
    color: #1e293b;
    font-family: Arial, sans-serif;
}

@media (max-width: 768px) {
    table { 
        min-width: 1400px; 
    }
    th { 
        font-size: 11px; 
        padding: 5px 6px; 
    }
    td { 
        font-size: 11px; 
        padding: 4px 6px; 
    }
}
</style>
</head>

<body>

<div class="top-controls">

    <!-- CENTERED HEADER -->
    <div class="header">
        <div class="header-brand">
            <h1>Mahatma Gandhi Institute of Technology</h1>
            <h2>Training & Placement Cell</h2>
            <h3>Academic Year 2026 - 2027</h3>
        </div>
    </div>

    <div class="main-wrapper">
        <!-- METRIC CARDS SECTION (6 CARDS IN 1 ROW) -->
        <div class="cards-container">
            <div class="card rank-filter-card">
                <h3>Rank Range Filter</h3>
                <div class="range-inputs">
                    <input type="number" id="minRank" placeholder="Min" step="1" min="1">
                    <span>-</span>
                    <input type="number" id="maxRank" placeholder="Max" step="1" min="1">
                </div>
            </div>

            <div class="card cgpa-filter-card">
                <h3>CGPA Range Filter</h3>
                <div class="range-inputs">
                    <input type="number" id="minCgpa" placeholder="Min" step="0.1" min="0" max="10">
                    <span>-</span>
                    <input type="number" id="maxCgpa" placeholder="Max" step="0.1" min="0" max="10">
                </div>
            </div>

            <div class="card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>
            <div class="card">
                <h3>Eligible Students</h3>
                <p id="eligibleStudents">0</p>
            </div>
            <div class="card">
                <h3>Total Students Placed</h3>
                <p id="placedStudents">0</p>
            </div>
            <div class="card">
                <h3>Total Offers</h3>
                <p id="totalOffers">0</p>
            </div>
        </div>

        <!-- SINGLE-ROW FILTER TOOLBAR -->
        <div class="filter-container">
            <input type="text" id="searchInput" placeholder="Search data...">
            
            <!-- MULTI-SELECT CHECKBOX DROPDOWN FOR BRANCH -->
            <div class="multiselect-container" data-key="branch">
                <div class="select-box" onclick="toggleMultiDropdown('branch')">
                    <span id="branchSelectLabel">Branch</span>
                    <small>▼</small>
                </div>
                <div class="checkboxes-dropdown" id="branchCheckboxes"></div>
            </div>

            <select id="entranceFilter"><option value="">Entrance</option></select>
            <select id="genderFilter"><option value="">Gender</option></select>
            
            <!-- MULTI-SELECT CHECKBOX DROPDOWN FOR DSA TRAINING -->
            <div class="multiselect-container" data-key="dsa">
                <div class="select-box" onclick="toggleMultiDropdown('dsa')">
                    <span id="dsaSelectLabel">DSA Training</span>
                    <small>▼</small>
                </div>
                <div class="checkboxes-dropdown" id="dsaCheckboxes"></div>
            </div>

            <select id="registeredFilter"><option value="">Registered for Placements</option></select>
            
            <!-- MULTI-SELECT CHECKBOX DROPDOWN FOR OFFERS -->
            <div class="multiselect-container" data-key="offers">
                <div class="select-box" onclick="toggleMultiDropdown('offers')">
                    <span id="offersSelectLabel">Offers</span>
                    <small>▼</small>
                </div>
                <div class="checkboxes-dropdown" id="offersCheckboxes"></div>
            </div>
            
            <button class="action-btn reset-btn" onclick="resetAllFilters()" title="Reset all applied filters">Reset Filters</button>
            <button class="action-btn export-btn" onclick="exportToExcel()" title="Export filtered rows to Excel">Export Excel</button>
        </div>
    </div>

</div>

<!-- DATA TABLE SECTION -->
<div class="table-container">
    <div class="loading" id="loading">Loading Student Placement Data...</div>
    <table id="dataTable"></table>
</div>

<script>
/* DIRECT GOOGLE SHEET CSV LINK INTEGRATION */
const csvURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRs918b9wOBmLLA6UJDOtpHMHNuNnzxYCYUIoYd5sIXg-sEkiYZtuNKYo8vEN4d7qWTpDoOvMWq7Cxc/pub?gid=981950419&single=true&output=csv";

let originalData = [];
let headers = [];

/* SINGLE SELECT FILTER DEFINITIONS */
const filterConfigs = [
    { id: 'entranceFilter', header: 'Entrance', key: 'entrance' },
    { id: 'genderFilter', header: 'Gender', key: 'gender' },
    { id: 'registeredFilter', header: 'Registered for Placements', key: 'registered' }
];

/* MULTI SELECT FILTER CONFIGURATIONS */
const multiFilterConfigs = [
    { key: 'branch', header: 'Branch', containerId: 'branchCheckboxes', labelId: 'branchSelectLabel', shortName: 'Branch' },
    { key: 'dsa', header: 'DSA', containerId: 'dsaCheckboxes', labelId: 'dsaSelectLabel', shortName: 'DSA' },
    { key: 'offers', header: 'No. of Offers', containerId: 'offersCheckboxes', labelId: 'offersSelectLabel', shortName: 'Offers' }
];

Papa.parse(csvURL, {
    download: true,
    skipEmptyLines: true,
    complete: function(results) {
        if (!results.data || results.data.length === 0) {
            document.getElementById("loading").innerText = "Error: No data found in CSV.";
            return;
        }

        headers = results.data[0];
        originalData = results.data.slice(1);

        // Build initial checkbox lists from full dataset so all options remain selectable
        multiFilterConfigs.forEach(mCfg => buildInitialMultiSelectDropdown(mCfg));

        applyFilters();

        document.getElementById("loading").style.display = "none";
    },
    error: function(err) {
        document.getElementById("loading").innerText = "Error loading CSV file.";
        console.error(err);
    }
});

/* FILTER ELEMENTS */
const searchInput = document.getElementById("searchInput");
const minRankInput = document.getElementById("minRank");
const maxRankInput = document.getElementById("maxRank");
const minCgpaInput = document.getElementById("minCgpa");
const maxCgpaInput = document.getElementById("maxCgpa");

/* EVENT LISTENERS */
searchInput.addEventListener("input", applyFilters);
minRankInput.addEventListener("input", applyFilters);
maxRankInput.addEventListener("input", applyFilters);
minCgpaInput.addEventListener("input", applyFilters);
maxCgpaInput.addEventListener("input", applyFilters);

filterConfigs.forEach(cfg => {
    const el = document.getElementById(cfg.id);
    if (el) el.addEventListener("change", applyFilters);
});

/* MULTI-SELECT DROPDOWN INTERACTION LOGIC */
function toggleMultiDropdown(key) {
    multiFilterConfigs.forEach(mCfg => {
        const dropdown = document.getElementById(mCfg.containerId);
        if (mCfg.key === key) {
            const isVisible = dropdown.style.display === "block";
            dropdown.style.display = isVisible ? "none" : "block";
        } else {
            dropdown.style.display = "none";
        }
    });
}

// Close multi-select menus when clicking outside
document.addEventListener("click", function(event) {
    if (!event.target.closest(".multiselect-container")) {
        multiFilterConfigs.forEach(mCfg => {
            const dropdown = document.getElementById(mCfg.containerId);
            if (dropdown) dropdown.style.display = "none";
        });
    }
});

/* ROBUST HEADER INDEX FINDER WITH ALIASES */
function getHeaderIndex(target) {
    if (!headers || headers.length === 0) return -1;
    
    let idx = headers.findIndex(h => String(h).trim().toLowerCase() === target.trim().toLowerCase());
    if (idx !== -1) return idx;

    const aliases = {
        "Branch": ["branch", "dept", "department"],
        "Entrance": ["entrance", "entry", "exam"],
        "Gender": ["gender", "sex"],
        "DSA": ["dsa", "dsa training"],
        "Registered for Placements": ["registered for placement", "registered for placements", "registered", "placement registration"],
        "No. of Offers": ["no. of offers", "no of offers", "number of offers", "offers", "total offers"],
        "CGPA": ["cgpa", "gpa", "marks"],
        "Rank": ["rank", "eamcet rank", "ecet rank", "entrance rank", "ht rank"]
    };

    const targetKey = Object.keys(aliases).find(k => k.toLowerCase() === target.toLowerCase()) || target;
    const targetAliases = aliases[targetKey] || [target.toLowerCase()];

    for (let alias of targetAliases) {
        idx = headers.findIndex(h => String(h).toLowerCase().includes(alias));
        if (idx !== -1) return idx;
    }

    return -1;
}

/* GET SELECTED VALUES FROM A MULTI-SELECT FILTER */
function getSelectedValues(key) {
    const checkboxes = document.querySelectorAll(`.${key}-checkbox:checked`);
    return Array.from(checkboxes).map(cb => cb.value.toLowerCase());
}

/* BUILD MULTI-SELECT OPTIONS INITIALIZATION */
function buildInitialMultiSelectDropdown(mCfg) {
    const container = document.getElementById(mCfg.containerId);
    const colIdx = getHeaderIndex(mCfg.header);

    if (colIdx === -1) {
        container.innerHTML = `<label>${mCfg.shortName} (N/A)</label>`;
        return;
    }

    let uniqueVals = [...new Set(originalData.map(r => String(r[colIdx] || "").trim()))]
        .filter(v => v !== undefined && v !== null && v !== "");

    uniqueVals.sort((a, b) => {
        const numA = Number(a), numB = Number(b);
        if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
        return a.localeCompare(b);
    });

    let html = `
        <label>
            <input type="checkbox" id="selectAll_${mCfg.key}" onchange="toggleSelectAll('${mCfg.key}', this)" checked>
            <strong>Select All</strong>
        </label>
    `;

    uniqueVals.forEach(val => {
        html += `
            <label>
                <input type="checkbox" class="${mCfg.key}-checkbox" value="${val}" onchange="onMultiCheckboxChange('${mCfg.key}')" checked>
                ${val}
            </label>
        `;
    });

    container.innerHTML = html;
    updateMultiSelectLabel(mCfg.key);
}

/* GET ACTIVE ROWS FILTERED BY ALL FILTERS EXCEPT ONE SPECIFIC KEY */
function getFilteredRowsExcluding(excludeKey = null) {
    const search = searchInput.value.toLowerCase();
    const minRankVal = minRankInput.value !== "" ? parseFloat(minRankInput.value) : null;
    const maxRankVal = maxRankInput.value !== "" ? parseFloat(maxRankInput.value) : null;
    const minCgpaVal = minCgpaInput.value !== "" ? parseFloat(minCgpaInput.value) : null;
    const maxCgpaVal = maxCgpaInput.value !== "" ? parseFloat(maxCgpaInput.value) : null;

    const rankIdx = getHeaderIndex("Rank");
    const cgpaIdx = getHeaderIndex("CGPA");

    return originalData.filter(row => {
        // Global search filter
        if (search && !row.join(" ").toLowerCase().includes(search)) return false;

        // Rank Range filter
        if (rankIdx !== -1) {
            let rowRank = parseFloat(row[rankIdx]);
            if (!isNaN(rowRank)) {
                if (minRankVal !== null && rowRank < minRankVal) return false;
                if (maxRankVal !== null && rowRank > maxRankVal) return false;
            } else if (minRankVal !== null || maxRankVal !== null) {
                return false;
            }
        }

        // CGPA Range filter
        if (cgpaIdx !== -1) {
            let rowCgpa = parseFloat(row[cgpaIdx]);
            if (!isNaN(rowCgpa)) {
                if (minCgpaVal !== null && rowCgpa < minCgpaVal) return false;
                if (maxCgpaVal !== null && rowCgpa > maxCgpaVal) return false;
            } else if (minCgpaVal !== null || maxCgpaVal !== null) {
                return false;
            }
        }

        // Apply Multi-Select Checkbox filters
        for (let mCfg of multiFilterConfigs) {
            if (mCfg.key === excludeKey) continue;
            const selectAllCb = document.getElementById(`selectAll_${mCfg.key}`);
            const selectAllChecked = selectAllCb ? selectAllCb.checked : true;

            if (!selectAllChecked) {
                const selectedVals = getSelectedValues(mCfg.key);
                const colIdx = getHeaderIndex(mCfg.header);
                if (colIdx !== -1) {
                    const rowVal = String(row[colIdx] || "").trim().toLowerCase();
                    if (!selectedVals.includes(rowVal)) return false;
                }
            }
        }

        // Apply Single Select Dropdown filters
        for (let cfg of filterConfigs) {
            if (cfg.key === excludeKey) continue;
            const el = document.getElementById(cfg.id);
            const val = el ? el.value : "";
            if (val) {
                const colIdx = getHeaderIndex(cfg.header);
                if (colIdx !== -1) {
                    const rowVal = String(row[colIdx] || "").trim();
                    if (rowVal.toLowerCase() !== val.toLowerCase()) return false;
                }
            }
        }

        return true;
    });
}

/* DYNAMICALLY UPDATE SINGLE DROPDOWN OPTIONS ONLY */
function updateDynamicFilterDropdowns() {
    filterConfigs.forEach(cfg => {
        const selectEl = document.getElementById(cfg.id);
        if (!selectEl) return;

        const currentValue = selectEl.value;
        const colIdx = getHeaderIndex(cfg.header);

        if (colIdx === -1) {
            selectEl.innerHTML = `<option value="">${cfg.header} (N/A)</option>`;
            return;
        }

        const matchingRows = getFilteredRowsExcluding(cfg.key);
        let uniqueVals = [...new Set(matchingRows.map(r => String(r[colIdx] || "").trim()))]
            .filter(v => v !== undefined && v !== null && v !== "");

        if (currentValue && !uniqueVals.some(v => v.toLowerCase() === currentValue.toLowerCase())) {
            uniqueVals.push(currentValue);
        }

        uniqueVals.sort((a, b) => {
            const numA = Number(a), numB = Number(b);
            if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
            return a.localeCompare(b);
        });

        const actualHeaderName = headers[colIdx] || cfg.header;
        let optionsHTML = `<option value="">${actualHeaderName}</option>`;
        uniqueVals.forEach(val => {
            const isSelected = (val.toLowerCase() === currentValue.toLowerCase()) ? "selected" : "";
            optionsHTML += `<option value="${val}" ${isSelected}>${val}</option>`;
        });

        selectEl.innerHTML = optionsHTML;
    });
}

/* CHECKBOX INTERACTION HANDLERS */
function toggleSelectAll(key, selectAllCb) {
    const checkboxes = document.querySelectorAll(`.${key}-checkbox`);
    checkboxes.forEach(cb => cb.checked = selectAllCb.checked);
    updateMultiSelectLabel(key);
    applyFilters();
}

function onMultiCheckboxChange(key) {
    const checkboxes = document.querySelectorAll(`.${key}-checkbox`);
    const selectAllCb = document.getElementById(`selectAll_${key}`);
    const checkedCount = document.querySelectorAll(`.${key}-checkbox:checked`).length;

    if (selectAllCb) {
        selectAllCb.checked = (checkedCount === checkboxes.length);
    }

    updateMultiSelectLabel(key);
    applyFilters();
}

function updateMultiSelectLabel(key) {
    const mCfg = multiFilterConfigs.find(c => c.key === key);
    if (!mCfg) return;

    const label = document.getElementById(mCfg.labelId);
    const selectAllCb = document.getElementById(`selectAll_${key}`);
    const selected = getSelectedValues(key);

    const title = mCfg.shortName;

    if (!selectAllCb || selectAllCb.checked) {
        label.innerText = `${title} (All)`;
    } else if (selected.length === 0) {
        label.innerText = `${title} (None)`;
    } else {
        label.innerText = `${title} (${selected.length})`;
    }
}

/* MAIN APPLY FILTERS LOGIC */
function applyFilters(){
    updateDynamicFilterDropdowns();
    const filtered = getFilteredRowsExcluding(null);
    createTable(headers, filtered);
    updateStatistics(filtered);
}

/* RESET ALL FILTERS LOGIC */
function resetAllFilters(){
    searchInput.value = "";
    minRankInput.value = "";
    maxRankInput.value = "";
    minCgpaInput.value = "";
    maxCgpaInput.value = "";
    
    filterConfigs.forEach(cfg => {
        const el = document.getElementById(cfg.id);
        if (el) el.value = "";
    });

    multiFilterConfigs.forEach(mCfg => {
        const selectAllCb = document.getElementById(`selectAll_${mCfg.key}`);
        if (selectAllCb) {
            selectAllCb.checked = true;
            toggleSelectAll(mCfg.key, selectAllCb);
        }
    });

    applyFilters();
}

/* EXPORT TO EXCEL LOGIC */
function exportToExcel(){
    const table = document.getElementById("dataTable");
    if (!table || table.rows.length <= 1) {
        alert("No filtered data available to export.");
        return;
    }

    let csvContent = "";
    for (let i = 0; i < table.rows.length; i++) {
        let row = table.rows[i];
        let rowData = [];
        for (let j = 0; j < row.cells.length; j++) {
            let cellText = row.cells[j].innerText.replace(/"/g, '""');
            rowData.push(`"${cellText}"`);
        }
        csvContent += rowData.join(",") + "\n";
    }

    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.setAttribute("download", "Student_Placement_Data.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

/* DYNAMIC TABLE GENERATION WITH LINK BUTTON SUPPORT */
function createTable(headers, rows){
    let tableHTML = "<thead><tr>";
    headers.forEach(header => {
        tableHTML += `<th>${header}</th>`;
    });
    tableHTML += "</tr></thead><tbody>";

    rows.forEach(row => {
        tableHTML += "<tr>";
        row.forEach(cell => {
            let val = cell !== undefined && cell !== null ? String(cell).trim() : "";
            if (val.includes("http")) {
                tableHTML += `<td><a href="${val}" target="_blank" class="link-btn">📄 View</a></td>`;
            } else {
                tableHTML += `<td>${val}</td>`;
            }
        });
        tableHTML += "</tr>";
    });
    tableHTML += "</tbody>";

    document.getElementById("dataTable").innerHTML = tableHTML;
}

/* CALCULATE STATISTICS BASED ON NUMERICAL RULES */
function updateStatistics(data){
    const cgpaIdx = getHeaderIndex("CGPA");
    const offersIdx = getHeaderIndex("No. of Offers");

    const totalStudents = data.length;

    const eligibleStudents = data.filter(row => {
        if (cgpaIdx === -1) return false;
        const val = parseFloat(row[cgpaIdx]);
        return !isNaN(val) && isFinite(val);
    }).length;

    const placedStudents = data.filter(row => {
        if (offersIdx === -1) return false;
        const val = parseFloat(row[offersIdx]);
        return !isNaN(val) && isFinite(val) && val > 0;
    }).length;

    const totalOffers = data.reduce((sum, row) => {
        if (offersIdx === -1) return sum;
        const val = parseFloat(row[offersIdx]);
        return sum + (!isNaN(val) && isFinite(val) ? val : 0);
    }, 0);

    document.getElementById("totalStudents").innerText = totalStudents;
    document.getElementById("eligibleStudents").innerText = eligibleStudents;
    document.getElementById("placedStudents").innerText = placedStudents;
    document.getElementById("totalOffers").innerText = totalOffers;
}
